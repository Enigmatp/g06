<!DOCTYPE html>
<html><body>
<canvas id="c"></canvas>
<script>
const img = new Image();
img.onload = function() {
  // Image is 640x640, fireballs centered around y=280-440
  const frameW = img.width / 4; // 160
  const cropY = 260;
  const cropH = 200;
  const canvas = document.getElementById('c');
  canvas.width = img.width;
  canvas.height = cropH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, cropY, img.width, cropH, 0, 0, img.width, cropH);
  canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fireball.png';
    a.click();
    document.title = 'DONE: ' + img.width + 'x' + cropH + ' frameW=' + frameW;
    document.body.innerHTML = '<h1>Cropped to ' + img.width + 'x' + cropH + '</h1><img src="' + url + '" style="border:1px solid red">';
  }, 'image/png');
};
img.src = 'assets/Tex/fireball.png';
</script>
</body></html>
