<!DOCTYPE html>
<html><body style="background:#333;display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px">
<h2 style="color:#fff">Processing hand cursor...</h2>
<canvas id="c" style="border:2px solid red"></canvas>
<img id="result" style="border:2px solid lime;background:repeating-conic-gradient(#808080 0% 25%, #fff 0% 50%) 50%/16px 16px">
<a id="dl" style="color:#0ff;font-size:24px">Download processed image</a>
<p id="status" style="color:#0f0;font-size:18px"></p>
<script>
const img = new Image();
img.onload = function() {
  const c = document.getElementById('c');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const d = data.data;
  
  // Remove green background
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    if (g > 200 && r < 100 && b < 100) {
      d[i+3] = 0;
    } else if (g > 150 && r < 150 && b < 150 && g > r * 1.3 && g > b * 1.3) {
      d[i+3] = Math.max(0, Math.min(255, 255 - (g - Math.max(r, b)) * 3));
    }
  }
  ctx.putImageData(data, 0, 0);
  
  // Find bounding box
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 0) {
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }
    }
  }
  
  // Crop and resize to 96x96
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = 96; out.height = 96;
  const octx = out.getContext('2d');
  octx.drawImage(c, minX, minY, cw, ch, 0, 0, 96, 96);
  
  const dataUrl = out.toDataURL('image/png');
  document.getElementById('result').src = dataUrl;
  document.getElementById('result').width = 96;
  document.getElementById('result').height = 96;
  
  const dl = document.getElementById('dl');
  dl.href = dataUrl;
  dl.download = 'hand_cursor.png';
  
  // Store for retrieval
  window.__processedImage = dataUrl;
  document.getElementById('status').textContent = 'DONE - ready to save';
  document.title = 'PROCESSED';
};
img.src = '/assets/Tex/hand_cursor.png?' + Date.now();
</script>
</body></html>
